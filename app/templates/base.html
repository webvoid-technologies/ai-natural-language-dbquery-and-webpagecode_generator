<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AI-powered natural language SQL and webpage code generator.">
  <title>{% block title %}AI Database & Code Generator{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}?v=5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">AI</span>
        <div><strong>AI Studio</strong><small>SQL + Code</small></div>
      </div>
      <nav aria-label="Main navigation">
        <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
          <span class="nav-icon">◆</span><span class="nav-label">Dashboard</span>
        </a>
        <a class="nav-link {% if request.url.path == '/database' %}active{% endif %}" href="/database">
          <span class="nav-icon">▤</span><span class="nav-label">Natural Language SQL</span>
        </a>
        <a class="nav-link {% if request.url.path == '/webpage' %}active{% endif %}" href="/webpage">
          <span class="nav-icon">▦</span><span class="nav-label">Screenshot Generator</span>
        </a>
        <a class="nav-link {% if request.url.path == '/schema' %}active{% endif %}" href="/schema">
          <span class="nav-icon">◈</span><span class="nav-label">Database Schema</span>
        </a>
        <a class="nav-link {% if request.url.path == '/history' %}active{% endif %}" href="/history">
          <span class="nav-icon">▣</span><span class="nav-label">Query History</span>
        </a>
        <a class="nav-link {% if request.url.path == '/settings' %}active{% endif %}" href="/settings">
          <span class="nav-icon">⚙</span><span class="nav-label">Settings</span>
        </a>
      </nav>
      <div class="provider"><span></span> Powered by Groq</div>
    </aside>
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    window.notify = function (message, error = false) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.className = `toast show${error ? ' error' : ''}`;
      clearTimeout(window.notify.timer);
      window.notify.timer = setTimeout(() => { toast.className = 'toast'; }, 3200);
    };
    (function () {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('drawer-overlay');
      const menu = document.getElementById('menu-button');
      function closeMenu() {
        if (!sidebar || !overlay || !menu) return;
        sidebar.classList.remove('open');
        overlay.classList.remove('open');
        menu.setAttribute('aria-expanded', 'false');
      }
      menu?.addEventListener('click', () => {
        const open = !sidebar.classList.contains('open');
        sidebar.classList.toggle('open', open);
        overlay.classList.toggle('open', open);
        menu.setAttribute('aria-expanded', String(open));
      });
      overlay?.addEventListener('click', closeMenu);
      document.querySelectorAll('.nav-link').forEach((link) => link.addEventListener('click', closeMenu));
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
